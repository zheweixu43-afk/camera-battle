<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131b">
<title>Camera Battle — Demo</title>
<style>
:root{color-scheme:dark;--cyan:#54e6ff;--red:#ff4e68;--panel:rgba(12,16,25,.78)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#080a10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
#app{position:relative;width:100%;height:100%;height:100dvh;background:#10131b}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:radial-gradient(ellipse at center,#29313c,#090b10)}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent 27%,transparent 62%,rgba(0,0,0,.72))}
.top{position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;gap:10px;justify-content:space-between;padding-top:10px}
.hp{width:46%;padding:10px 12px;background:var(--panel);border:1px solid #ffffff26;border-radius:14px;backdrop-filter:blur(10px)}
.hp .line{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.08em;margin-bottom:7px}
.track{height:8px;border-radius:99px;background:#ffffff24;overflow:hidden}
.fill{height:100%;width:100%;background:linear-gradient(90deg,#49e89a,#b4ff77);transition:width .2s}
.enemy .fill{background:linear-gradient(90deg,#ff8a58,#ff365f)}
#crosshair{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:42px;color:var(--cyan);text-shadow:0 0 14px #54e6ff;pointer-events:none}
#notice{position:absolute;top:34%;left:50%;transform:translateX(-50%);font-weight:900;font-size:clamp(24px,7vw,38px);text-shadow:0 3px 15px #000;opacity:0;transition:opacity .15s;white-space:nowrap}
#notice.show{opacity:1}
.bottom{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:end;justify-content:space-between;gap:12px}
.weaponbox{background:var(--panel);border:1px solid #ffffff26;border-radius:14px;padding:10px 12px;backdrop-filter:blur(10px);min-width:112px}
.weaponbox label{display:block;font-size:10px;color:#a8b4c8;letter-spacing:.12em;margin-bottom:5px}
select{background:#1b2432;color:white;border:1px solid #ffffff30;border-radius:8px;padding:8px;width:100%;font-size:14px}
#fire{width:88px;height:88px;border-radius:50%;border:2px solid #ff9aa9;background:radial-gradient(circle at 35% 30%,#ff8b9b,#e21f48 65%,#801126);box-shadow:0 0 22px #ff335555,inset 0 0 0 5px #ffffff12;color:#fff;font-weight:900;font-size:14px;letter-spacing:.06em}
#fire:active{transform:scale(.94)}
#fire:disabled{opacity:.45}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,7,12,.8);padding:24px;text-align:center}
.card{max-width:360px;background:#151b27;border:1px solid #ffffff22;border-radius:20px;padding:24px;box-shadow:0 20px 60px #0008}
.card h1{margin:0 0 8px;font-size:26px;letter-spacing:.08em}
.card p{color:#c4ccda;line-height:1.55;font-size:14px}
.primary{background:#35cfe9;color:#07131a;border:0;border-radius:12px;padding:13px 18px;font-weight:900;font-size:16px;width:100%;margin-top:10px}
.small{font-size:11px!important;color:#8f9bad!important}
#result{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#06080ddd;text-align:center;padding:24px}
#result h2{font-size:38px;margin:0 0 12px}
</style>
</head>
<body>
<div id="app">
  <video id="camera" autoplay muted playsinline></video>
  <div id="shade"></div>
  <div class="top">
    <div class="hp"><div class="line"><span>YOU</span><span id="myText">100 HP</span></div><div class="track"><div class="fill" id="myFill"></div></div></div>
    <div class="hp enemy"><div class="line"><span>OPPONENT</span><span id="enemyText">100 HP</span></div><div class="track"><div class="fill" id="enemyFill"></div></div></div>
  </div>
  <div id="crosshair">＋</div><div id="notice">HIT!</div>
  <div class="bottom">
    <div class="weaponbox"><label>WEAPON</label><select id="weapon"><option value="10">Laser • 10 DMG</option><option value="20">Plasma • 20 DMG</option><option value="35">Energy • 35 DMG</option></select></div>
    <button id="fire" disabled>FIRE</button>
  </div>
  <div id="start"><div class="card">
    <h1>CAMERA BATTLE</h1>
    <p>攝影機對戰原型<br>啟動相機後，點擊 FIRE 測試武器與血量。</p>
    <button class="primary" id="startBtn">啟動攝影機</button>
    <p class="small">此原型目前是單機展示：對手血量為測試值，尚未連線到另一支手機。請在 Safari 的 HTTPS 網址中開啟，並允許相機權限。</p>
  </div></div>
  <div id="result"><div><h2 id="resultTitle">YOU WIN!</h2><p id="resultText">測試對局結束</p><button class="primary" id="again">再玩一次</button></div></div>
</div>
<script>
const video=document.querySelector('#camera');
const startLayer=document.querySelector('#start');
const startBtn=document.querySelector('#startBtn');
const fire=document.querySelector('#fire');
const notice=document.querySelector('#notice');
const result=document.querySelector('#result');
const myFill=document.querySelector('#myFill'), enemyFill=document.querySelector('#enemyFill');
const myText=document.querySelector('#myText'), enemyText=document.querySelector('#enemyText');
let myHP=100, enemyHP=100, stream=null, noticeTimer;
function render(){
  myFill.style.width=myHP+'%'; enemyFill.style.width=enemyHP+'%';
  myText.textContent=myHP+' HP'; enemyText.textContent=enemyHP+' HP';
}
async function startCamera(){
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error('這個環境無法啟用相機。請使用支援相機的 Safari HTTPS 網址。');
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    video.srcObject=stream;
    await video.play();
    startLayer.style.display='none'; fire.disabled=false;
  }catch(err){
    alert('無法啟動攝影機：'+(err.message||'請檢查相機權限，並確認以 HTTPS 網址開啟。'));
  }
}
function showNotice(text){
  notice.textContent=text; notice.classList.add('show');
  clearTimeout(noticeTimer); noticeTimer=setTimeout(()=>notice.classList.remove('show'),650);
}
fire.addEventListener('click',()=>{
  if(enemyHP<=0||myHP<=0)return;
  const damage=Number(document.querySelector('#weapon').value);
  enemyHP=Math.max(0,enemyHP-damage);
  showNotice('HIT! -'+damage);
  render();
  // Demo-only opponent response, to exercise both health bars.
  setTimeout(()=>{
    if(enemyHP>0){
      myHP=Math.max(0,myHP-8);
      render();
      if(myHP===0)finish(false);
    }
    if(enemyHP===0)finish(true);
  },450);
});
function finish(win){
  fire.disabled=true; result.style.display='flex';
  document.querySelector('#resultTitle').textContent=win?'YOU WIN!':'YOU LOSE!';
  document.querySelector('#resultText').textContent='本機測試對局結束。雙人連線尚未加入。';
}
document.querySelector('#again').addEventListener('click',()=>{
  myHP=100;enemyHP=100;render();result.style.display='none';fire.disabled=false;
});
startBtn.addEventListener('click',startCamera);
render();
</script>
</body>
</html>
